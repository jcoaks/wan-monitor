services:
  wan-monitor:
    build: .
    container_name: wan-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Local timezone, used for the time of day in AI-written alerts.
      # ANTHROPIC_API_KEY (and the optional AI_* settings) come from .env.
      TZ: ${TZ:-America/Caracas}
    # The router is on the host's LAN, not inside a docker network, so the
    # container needs to be able to reach 192.168.0.1 directly.
    network_mode: bridge
